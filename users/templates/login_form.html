{% extends 'base.html' %}
{% load static %}
{%  load crispy_forms_tags %}

{% block title %}Login form {% endblock %}

{% block container %}


    <form action="{% url 'users:login' %}" method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <input class="btn btn-success" type="submit" value="Zaloguj się">
    </form>


{% endblock %}
