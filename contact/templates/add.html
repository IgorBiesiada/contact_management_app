{%extends 'base.html'%}
{% load static %}

{% load crispy_forms_tags %}

{% block scripts %}
    {{block.super}}
    <script src="{% static 'scripts/validForm.js' %}"></script>
{% endblock %}

{% block title %} Dodaj kontakt {% endblock %}

{% block container %}
<form method="post" id="form" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Dodaj kontakt</button>
  </form>
{% endblock %}
