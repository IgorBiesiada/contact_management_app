services:
  db:
    image: postgres:17 
    volumes:
      - postgres_data:/var/lib/postgresql/data # 
    environment:
      - POSTGRES_DB=rekrutacja
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DB_STRING}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
      image: adminer
      restart: always
      ports:
        - "8080:8080"
      depends_on:
        - db

volumes:
  postgres_data: